<script>
let currentQuery='', currentCat='all', viewMode='grid', filtered=[];

// ── DYNAMIC AI PHOTO SEARCH SYSTEM ──
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) {
      resolve();
      return;
    }
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

async function loadAIModels() {
  await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js');
}

function showAnalysisOverlay(imageDataUrl) {
  const overlay = document.createElement('div');
  overlay.id = 'aiAnalysisOverlay';
  overlay.style.position = 'fixed';
  overlay.style.inset = '0';
  overlay.style.backgroundColor = 'rgba(28, 28, 26, 0.7)';
  overlay.style.backdropFilter = 'blur(12px)';
  overlay.style.webkitBackdropFilter = 'blur(12px)';
  overlay.style.zIndex = '99999';
  overlay.style.display = 'flex';
  overlay.style.alignItems = 'center';
  overlay.style.justifyContent = 'center';
  overlay.style.color = 'var(--cream)';
  overlay.style.fontFamily = "'Inter', sans-serif";
  overlay.style.animation = 'fadeIn 0.25s ease';

  overlay.innerHTML = `
    <div style="background: var(--white); color: var(--ink); border: 1px solid var(--sand); border-radius: var(--radius-lg); padding: 2.5rem 2rem; width: 90%; max-width: 420px; box-shadow: var(--shadow-xl); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; position: relative;">
      <button id="cancelAnalysisBtn" style="position: absolute; top: 1rem; right: 1rem; width: 32px; height: 32px; border-radius: 50%; background: var(--warm); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; transition: background var(--transition);" title="Cancel">✕</button>
      <h3 style="font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--forest); margin: 0;">AI Photo Search</h3>
      <div style="width: 150px; height: 150px; border-radius: var(--radius); overflow: hidden; border: 2.5px solid var(--forest); box-shadow: var(--shadow); background: var(--warm); display: flex; align-items: center; justify-content: center;">
        <img id="analysisPreviewImg" src="${imageDataUrl}" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 24px; height: 24px; border: 3px solid rgba(45, 74, 47, 0.15); border-top-color: var(--forest); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <span id="analysisStatusText" style="font-size: 0.95rem; font-weight: 500; color: var(--muted);">${t('photo_status_loading_model')}</span>
      </div>
      <p style="font-size: 0.82rem; color: var(--muted); margin: 0; line-height: 1.5;">Detecting items and matching with supermarket stock in Kazakhstan...</p>
    </div>
  `;
  document.body.appendChild(overlay);
  
  document.getElementById('cancelAnalysisBtn').onclick = () => {
    hideAnalysisOverlay();
    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
    window.history.replaceState({path: cleanUrl}, '', cleanUrl);
  };
}

function updateAnalysisStatus(text) {
  const el = document.getElementById('analysisStatusText');
  if (el) el.textContent = text;
}

function hideAnalysisOverlay() {
  const overlay = document.getElementById('aiAnalysisOverlay');
  if (overlay) overlay.remove();
}

function runAIClassification(imageDataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = async function() {
      try {
        updateAnalysisStatus(t('photo_status_loading_model'));
        await loadAIModels();
        
        updateAnalysisStatus(t('photo_status_analyzing'));
        if (!window.$mobilenetModel) {
          window.$mobilenetModel = await mobilenet.load();
        }
        
        updateAnalysisStatus(t('photo_status_matching'));
        const predictions = await window.$mobilenetModel.classify(img);
        resolve(predictions);
      } catch (err) {
        reject(err);
      }
    };
    img.onerror = reject;
    img.src = imageDataUrl;
  });
}

function matchPhotoToProducts(fileName, predictions) {
  let fileKeywords = [];
  if (fileName) {
    const baseName = fileName.toLowerCase().replace(/\.[^/.]+$/, "");
    const cleaned = baseName.replace(/[^a-z0-9]/g, " ");
    fileKeywords = cleaned.split(/\s+/).filter(w => w.length > 1);
  }
  
  let predictedKeywords = [];
  let isPerfumeContext = false;
  let isBeverageContext = false;
  
  if (predictions && predictions.length > 0) {
    predictions.forEach(pred => {
      const clsName = pred.className.toLowerCase();
      const words = clsName.split(/[\s,]+/);
      words.forEach(w => {
        if (w.length > 1) {
          predictedKeywords.push({ word: w, prob: pred.probability });
        }
      });
      
      if (clsName.includes("perfume") || clsName.includes("fragrance") || clsName.includes("cologne") || clsName.includes("essence") || clsName.includes("cosmetic") || clsName.includes("lotion") || clsName.includes("toilet water")) {
        isPerfumeContext = true;
      }
      if (clsName.includes("pop") || clsName.includes("soda") || clsName.includes("drink") || clsName.includes("juice") || clsName.includes("water") || clsName.includes("cola") || clsName.includes("beverage")) {
        isBeverageContext = true;
      }
    });
  }
  
  let normalizedWords = [];
  
  fileKeywords.forEach(word => {
    let normalized = word;
    if (word === "fragrance" || word === "cologne" || word === "essence") normalized = "perfume";
    normalizedWords.push({ word: normalized, source: 'file', weight: 1.0 });
  });
  
  predictedKeywords.forEach(pw => {
    let normalized = pw.word;
    
    if (pw.word === "fragrance" || pw.word === "cologne" || pw.word === "essence") {
      normalized = "perfume";
    }
    
    if (pw.word === "bottle") {
      if (isPerfumeContext) {
        normalizedWords.push({ word: "perfume", source: 'prediction', weight: pw.prob * 1.5 });
        normalizedWords.push({ word: "care", source: 'prediction', weight: pw.prob * 0.8 });
      }
      if (isBeverageContext) {
        normalizedWords.push({ word: "drink", source: 'prediction', weight: pw.prob * 1.5 });
        normalizedWords.push({ word: "beverages", source: 'prediction', weight: pw.prob * 0.8 });
      }
      normalized = "bottle";
    }
    
    if (normalized === "perfume") {
      normalizedWords.push({ word: "care", source: 'prediction', weight: pw.prob * 1.0 });
    }
    if (normalized === "soda" || normalized === "coke" || normalized === "juice" || normalized === "water") {
      normalizedWords.push({ word: "beverages", source: 'prediction', weight: pw.prob * 1.0 });
      normalizedWords.push({ word: "drink", source: 'prediction', weight: pw.prob * 1.0 });
    }
    if (normalized === "milk" || normalized === "yogurt" || normalized === "cheese" || normalized === "butter" || normalized === "kefir" || normalized === "cream") {
      normalizedWords.push({ word: "dairy", source: 'prediction', weight: pw.prob * 1.0 });
    }
    if (normalized === "bread" || normalized === "baguette" || normalized === "loaf" || normalized === "flour" || normalized === "bakery") {
      normalizedWords.push({ word: "bakery", source: 'prediction', weight: pw.prob * 1.0 });
    }
    if (normalized === "shampoo" || normalized === "soap" || normalized === "gel" || normalized === "toothpaste") {
      normalizedWords.push({ word: "care", source: 'prediction', weight: pw.prob * 1.0 });
    }
    
    normalizedWords.push({ word: normalized, source: 'prediction', weight: pw.prob });
  });
  
  const scoredProducts = PRODUCTS.map(p => {
    let score = 0;
    let exactMatch = false;
    let matchReasons = [];
    
    if (fileName) {
      const pImageFile = p.image ? p.image.split('/').pop().toLowerCase() : "";
      const baseName = fileName.toLowerCase().replace(/\.[^/.]+$/, "");
      
      if (pImageFile && pImageFile.includes(baseName)) {
        score += 200;
        exactMatch = true;
        matchReasons.push('image_filename');
      }
      
      const cleanProdName = p.name.toLowerCase().replace(/[^a-z0-9]/g, " ");
      if (cleanProdName.includes(baseName) || baseName.includes(cleanProdName)) {
        score += 150;
        exactMatch = true;
        matchReasons.push('name_exact');
      }
    }
    
    normalizedWords.forEach(nw => {
      const word = nw.word;
      const weight = nw.weight;
      
      if (p.name.toLowerCase().includes(word)) {
        score += 40 * weight;
        matchReasons.push('name_keyword');
        if (nw.source === 'file') exactMatch = true;
      }
      
      if (p.brand.toLowerCase().includes(word)) {
        score += 30 * weight;
        matchReasons.push('brand_keyword');
        if (nw.source === 'file') exactMatch = true;
      }
      
      if (p.tags && p.tags.some(t => t.toLowerCase() === word || t.toLowerCase().includes(word))) {
        score += 25 * weight;
        matchReasons.push('tag');
      }
      
      if (p.category.toLowerCase() === word) {
        score += 15 * weight;
        matchReasons.push('category');
      }
    });
    
    return { product: p, score: score, exactMatch: exactMatch, reasons: matchReasons };
  });
  
  const filteredScored = scoredProducts
    .filter(sp => sp.score > 0)
    .sort((a, b) => b.score - a.score);

  if (filteredScored.length > 0) {
    const topMatch = filteredScored[0];
    const primaryCat = topMatch.product.category;
    
    const RELATED_CATEGORIES = {
      'dairy': ['dairy', 'special_diet', 'organic'],
      'bakery': ['bakery', 'special_diet'],
      'meat': ['meat'],
      'veg': ['veg', 'fruits', 'organic'],
      'fruits': ['fruits', 'veg', 'organic'],
      'beverages': ['beverages', 'fitness', 'special_diet'],
      'frozen': ['frozen'],
      'care': ['care', 'baby'],
      'home': ['home'],
      'baby': ['baby', 'care'],
      'international': ['international'],
      'special_diet': ['special_diet', 'dairy', 'bakery', 'organic'],
      'fitness': ['fitness', 'beverages'],
      'organic': ['organic', 'dairy', 'veg', 'fruits']
    };
    
    const allowedCats = RELATED_CATEGORIES[primaryCat] || [primaryCat];
    return filteredScored.filter(sp => allowedCats.includes(sp.product.category));
  }
  
  return [];
}

function renderPhotoSearchBanner(resizedDataUrl, exactMatchProd, scoredResults) {
  const banner = document.getElementById('sourceBanner');
  if (!banner) return;
  
  let labelText = '';
  if (exactMatchProd) {
    labelText = `${t('exact_match_found')}: <strong>${exactMatchProd.name}</strong>`;
  } else if (scoredResults.length > 0) {

function clearPhotoSearch() {

  sessionStorage.removeItem('pending_photo_search_name');

  window.$photoSearchImage = null;
  window.$photoSearchExact = null;

  currentQuery = '';
  
  const banner = document.getElementById('sourceBanner');
  if (banner) {
    banner.style.display = 'none';
    banner.innerHTML = '';
  }
  
  applyFilters();
  
  const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
  window.history.replaceState({path: cleanUrl}, '', cleanUrl);
}

async function executePhotoSearch(resizedDataUrl, fileName) {
  if (resizedDataUrl) {
    showAnalysisOverlay(resizedDataUrl);
  }
  
  try {
    let predictions = [];
    if (resizedDataUrl) {
      predictions = await runAIClassification(resizedDataUrl);
    }
    
    const scoredResults = matchPhotoToProducts(fileName, predictions);
    
    window.$photoSearchResults = scoredResults;
    window.$photoSearchImage = resizedDataUrl;
    
    let exactMatchProd = null;
    scoredResults.forEach(r => {
      if (r.exactMatch && !exactMatchProd) {
        exactMatchProd = r.product;
      }
    });
    
    window.$photoSearchExact = exactMatchProd;
    
    if (exactMatchProd) {
      document.getElementById('mainInput').value = exactMatchProd.name;
      currentQuery = exactMatchProd.name;
    } else if (scoredResults.length > 0) {
      const catId = scoredResults[0].product.category;
      const catObj = CATEGORIES.find(c => c.id === catId);
      const catLabel = catObj ? t(catObj.name) : catId;
      document.getElementById('mainInput').value = catLabel;
      currentQuery = catLabel;
    } else {
      document.getElementById('mainInput').value = fileName.split('.')[0];
      currentQuery = fileName.split('.')[0];
    }
    
    applyFilters();
    renderPhotoSearchBanner(resizedDataUrl, exactMatchProd, scoredResults);
    
  } catch (err) {
    console.error("Photo search execution failed:", err);
    alert("AI analysis failed, falling back to name matching.");
    
    const query = fileName.split('.')[0].replace(/[-_.]/g, ' ');
    document.getElementById('mainInput').value = query;
    currentQuery = query;
    applyFilters();
  } finally {
    hideAnalysisOverlay();
  }
}

function getActiveStoreFilters() {
  const active = getStoresForCity().filter(s => document.getElementById('fs_'+s.id)?.checked).map(s=>s.id);

}

function applyFilters() {
  let results = window.$photoSearchResults
    ? window.$photoSearchResults.map(r => r.product)
    : (currentQuery ? searchProducts(currentQuery) : [...PRODUCTS]);

  // Hard filter by store when browsing a specific store
  if (activeStoreId) {
    results = results.filter(p => p.price && p.price[activeStoreId] > 0);
    results.forEach(p => p.storeId = activeStoreId);
    if (!currentQuery && currentCat === 'all') updateStoreBannerCount(results.length);
  } else {
    results.forEach(p => delete p.storeId);
  }

  if(currentCat !== 'all') results = results.filter(p=>p.category===currentCat);
  const inStock = document.getElementById('fInStock')?.checked;
  const maxPrice = parseInt(document.getElementById('priceRange')?.value||1000000);
  const maxDist = parseFloat(document.getElementById('distRange')?.value||5);
  const activeStores = getActiveStoreFilters();

  if(inStock) results = results.filter(p => {
    if (activeStoreId) return p.stock && p.stock[activeStoreId] === 'in';
    return Object.values(p.stock).some(v=>v==='in');
  });
  results = results.filter(p => {
    const prices = activeStoreId
      ? [p.price[activeStoreId]].filter(v => v > 0)
      : Object.values(p.price).filter(v=>v>0);
    return prices.length && Math.min(...prices) <= maxPrice;
  });
  if (!activeStoreId) {
    results = results.filter(p => {
      const stores = getStoresForProduct(p);
      return stores.some(s=>s.distance<=maxDist);
    });
  }
  if(activeStores && !activeStoreId) results = results.filter(p=>activeStores.some(id=>p.price[id]>0));

  // Sort
  const sort = document.getElementById('sortSelect')?.value||'relevance';
  if(sort==='price-asc') results.sort((a,b)=>{
    const pa=Math.min(...Object.values(a.price).filter(v=>v>0));
    const pb=Math.min(...Object.values(b.price).filter(v=>v>0));
    return pa-pb;
  });
  else if(sort==='price-desc') results.sort((a,b)=>{
    const pa=Math.min(...Object.values(a.price).filter(v=>v>0));
    const pb=Math.min(...Object.values(b.price).filter(v=>v>0));
    return pb-pa;
  });
  else if(sort==='distance') results.sort((a,b)=>{
    const da=Math.min(...getStoresForProduct(a).map(s=>s.distance));
    const db=Math.min(...getStoresForProduct(b).map(s=>s.distance));
    return da-db;
  });
  else if(sort==='unit-price') results.sort((a,b)=>{
    const best_a = getCheapestStore(a);
    const best_b = getCheapestStore(b);
    if(!best_a) return 1; if(!best_b) return -1;
    const ua = getUnitPrice(a,best_a);
    const ub = getUnitPrice(b,best_b);
    return (ua?.value||9999)-(ub?.value||9999);
  });

  filtered = results;
  renderResults(results);
}

  } else {
    countText = t('results_found').replace('{count}', `<strong>${results.length}</strong>`);
  }
  document.getElementById('resultsCount').innerHTML = countText;

  if(!results.length) {
    if (activeStoreId && activeStoreObj) {
      container.innerHTML=`<div class="no-results">
        <div class="nr-icon">${activeStoreObj.emoji}</div>
        <h3>No products found in ${activeStoreObj.name}</h3>
        <p style="max-width:360px;margin:.5rem auto 1.5rem;font-size:.9rem;color:var(--muted)">
          ${currentQuery ? 'No matching products at this store. Try a different search term.' : 'This store has no products in our database yet.'}
        </p>
        ${currentQuery ? `<button class="btn btn-ghost" onclick="document.getElementById('mainInput').value='';currentQuery='';applyFilters()" style="margin-bottom:.75rem">Clear Search</button><br>` : ''}
        <a href="stores.html" class="btn btn-primary" style="margin-top:.5rem">← All Stores</a>
      </div>`;
    } else {
      container.innerHTML=`<div class="no-results"><div class="nr-icon">🔍</div><h3>${t('no_results')}</h3><a href="search.html" class="btn btn-outline" style="margin-top:1rem" data-i18n="all">${t('all')}</a></div>`;
    }
    return;
  }

  const gridClass = viewMode==='grid' ? 'products-grid' : 'products-grid list-view';
  container.className = viewMode==='list' ? 'list-view' : '';

  if (window.$photoSearchResults) {
    const exactMatch = window.$photoSearchExact;
    const isExactMatchFiltered = exactMatch && results.some(p => p.id === exactMatch.id);
    
    if (isExactMatchFiltered) {
      const exactHtml = `
        <div style="margin-bottom: 2rem;">
          <div class="section-tag forest" style="font-weight: 700; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--success-d);">
            <span>🎯</span> ${t('exact_match_found')}
          </div>
          <div style="max-width: 320px;">
            ${renderCard(exactMatch, true)}
          </div>
        </div>
      `;
      
      const similarProducts = results.filter(p => p.id !== exactMatch.id);
      let similarHtml = '';
      if (similarProducts.length > 0) {
        similarHtml = `
          <div>
            <div class="section-tag" style="font-weight: 700; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;">
              <span>📷</span> ${t('similar_products')}
            </div>
            <div class="${gridClass}">
              ${similarProducts.map(p => renderCard(p)).join('')}
            </div>
          </div>
        `;
      }
      
      container.innerHTML = exactHtml + similarHtml;
    } else {
      container.innerHTML = `
        <div>
          <div class="section-tag" style="font-weight: 700; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;">
            <span>📷</span> ${t('similar_products')}
          </div>
          <div class="${gridClass}">
            ${results.map(p => renderCard(p)).join('')}
          </div>
        </div>
      `;
    }
  } else {
    container.innerHTML = `<div class="${gridClass}">${results.map(p => renderCard(p)).join('')}</div>`;
  }

  if (window.animateDynamicElements) {
    window.animateDynamicElements('.product-card');
  }
}

      ${price?`<div style="margin:.4rem 0">

function photoSearch() {
  const input = document.getElementById('photoInput2');
  if (input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const maxDim = 400;
        let width = img.width;
        let height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        try {
          const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          executePhotoSearch(resizedDataUrl, file.name);
        } catch (err) {
          console.error("Failed to resize image", err);
          executePhotoSearch(null, file.name);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

// Check for pending photo search in sessionStorage on load
window.addEventListener('DOMContentLoaded', () => {
  const pendingData = sessionStorage.getItem('pending_photo_search_data');
  const pendingName = sessionStorage.getItem('pending_photo_search_name');
  
  if (pendingData && pendingName) {
    sessionStorage.removeItem('pending_photo_search_data');
    sessionStorage.removeItem('pending_photo_search_name');
    
    // Clear URL source parameter to clean up state
    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
    window.history.replaceState({path: cleanUrl}, '', cleanUrl);
    
    executePhotoSearch(pendingData, pendingName);
  }
});
</script>
